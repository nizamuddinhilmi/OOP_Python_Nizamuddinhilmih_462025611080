<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Rak Baca — Pemesanan Buku Online{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,500&family=Source+Serif+4:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<header>
  <div class="wrap nav">
    <a href="{{ url_for('index') }}" style="text-decoration:none;">
      <div class="logo">RAK BACA<span class="dot">.</span></div>
    </a>
    <nav class="navlinks">
      <a href="{{ url_for('index') }}" class="linklike" style="text-decoration:none;">Katalog</a>
    </nav>
    <div style="display:flex;gap:10px;align-items:center;">
      <a href="{{ url_for('admin') }}" class="admin-toggle" style="text-decoration:none;display:inline-block;">Mode Admin</a>
      <a href="{{ url_for('cart_view') }}" class="cart-btn" style="text-decoration:none;display:inline-flex;">
        Keranjang <span>({{ cart_count }})</span>
      </a>
    </div>
  </div>
</header>

<main>
  {% block content %}{% endblock %}
</main>

<footer>
  <div class="wrap" style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;">
    <p>RAK BACA — final project: Pengembangan Website Pemesanan Buku Berbasis Online (Flask / Python)</p>
    <p>Encapsulation · Inheritance · Polymorphism · Abstraction</p>
  </div>
</footer>

</body>
</html>
